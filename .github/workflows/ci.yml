name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Build, Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CI
        run: npm run ci

      # Exercise the whole publish path on every PR, short of the upload. It needs no token
      # (--dry-run never contacts the registry) and costs seconds, but it runs the two checks
      # whose failure is otherwise invisible until a real publish: that stripping the bundled
      # @quimbyhq/* deps leaves every runtime import still declared, and that `npm pack` produces
      # a tarball. The failure it guards against — a dependency moved into a bundled package,
      # so the published tarball installs and then crashes — is introduced by an ordinary code
      # change, which is exactly when this runs.
      - name: Publish preflight (dry run)
        run: npm run release -- --no-build --dry-run

      # Provision the end-to-end harness's dependencies so every suite actually runs instead of
      # self-skipping: Suite A (git + built CLI) needs nothing extra, Suite B needs tmux, and
      # Suite C needs passwordless loopback sshd + rsync. The final `ssh` sanity check fails the
      # step (set -e) if loopback is broken, so a provisioning regression surfaces loudly rather
      # than letting Suite C silently skip.
      - name: Provision integration dependencies (tmux + loopback sshd)
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y tmux openssh-server rsync
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          sudo mkdir -p /run/sshd
          sudo systemctl start ssh || sudo service ssh start
          ssh-keyscan -H localhost 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null
          # Pin the loopback user so `sshLoopbackHost()` never falls back to root (its default
          # when $USER is unset), which has no authorized key.
          echo "USER=$(id -un)" >> "$GITHUB_ENV"
          ssh -o BatchMode=yes -o ConnectTimeout=5 localhost 'echo loopback-ok as $(id -un)'

      - name: Integration tests
        run: npm run test:integration

  # The continuous channel: every green push to main publishes a snapshot to npm's `next`
  # dist-tag, so `npm i -g quimby@next` is always the tip of main. The deliberate `latest`
  # release is release.yml, cut from a bare numeric tag. Gated on `ci`, so a red commit
  # publishes nothing, and skipped entirely on pull requests.
  snapshot:
    name: Publish snapshot to `next`
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # npm provenance

    concurrency:
      group: snapshot
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          # snapshot-version.ts reads the commits since the last version tag to pick the bump
          # level and the build count, so a shallow clone would compute the wrong version.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Compute the snapshot version
        id: snapshot
        run: npm run --silent snapshot:version >> "$GITHUB_OUTPUT"

      # Stamps apps/cli only; the working tree is never committed or pushed, so the version
      # lives in the published tarball and nowhere else.
      - name: Stamp the version
        run: npm run version:package -- "${{ steps.snapshot.outputs.version }}"

      - name: Build
        run: npm run build

      - name: Publish
        run: npm run release -- --no-build --tag "${{ steps.snapshot.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a PUBLIC repo — on a private one npm rejects the publish outright.
          # Deriving it from the repo's own visibility means this workflow does not have to be
          # edited when quimby goes public, and never fails for a reason unrelated to the build.
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
