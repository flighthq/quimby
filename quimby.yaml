hosts:
  remote:
    type: ssh
    host: remote

runtimeProfiles:
  claude-sbx:
    runtime: sbx
    entrypoint: claude
    requiredTools:
      - claude
  codex-sbx:
    runtime: sbx
    entrypoint: codex
    requiredTools:
      - codex

defaults:
  runtimeProfile: claude-sbx
  tmux: true
  hostAlias: remote

roles:
  review: {}
  builder: {}
  integration: {}

services:
  serve: quimby serve

layouts:
  default:
    expr: (review | builder):80 / (host $serve):20

default: default

presets:
  default:
    layout: default
    agents:
      review:
        role: review
        # Standing authority edge: review may direct builder on its own initiative
        # (its handoffs to builder are host-stamped user-directed). Default-deny —
        # absence of `directs` means an ordinary advisory peer. See
        # tools/agents/docs/coordination-proposals.md § Directed relationships.
        directs: [builder]
      builder:
        role: builder
        runtimeProfile: codex-sbx
