hosts:
  remote:
    type: ssh
    host: remote

runtimeProfiles:
  claude-sbx:
    runtime: sbx
    entrypoint: claude
    requiredTools: [claude]
  codex-sbx:
    runtime: sbx
    entrypoint: codex
    requiredTools: [codex]

defaults:
  runtimeProfile: claude-sbx
  tmux: true
  hostAlias: remote

roles:
  review: {}
  builder: {}

services:
  serve: quimby serve

layouts:
  default:
    expr: (review | builder):80 / (host $serve):20

default: default

presets:
  default:
    layout: default
    agents:
      review:
        role: review
        # `directs: [builder]` is the coordination edge (proposal §6/§6a; DECLARED, host-enforced
        # once §6 lands). It means review may direct builder on its own initiative (host-stamps the
        # parcel userDirected) AND — the active/passive split — review's DIRECTED handoffs are the
        # only ones that interrupt (nudge) builder; advisory notes and the status mirror stay
        # passive (read on builder's own turn). Absence of `directs` = ordinary advisory peer.
        directs: [builder]
      builder:
        role: builder
        runtimeProfile: codex-sbx
